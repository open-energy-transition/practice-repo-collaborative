[project]
name = "costs"
version = "0.1.0"
description = "Practice repository for the open source contribution workflow"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[dependency-groups]
dev = ["pytest>=8", "pre-commit>=4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/costs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
